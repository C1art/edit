name: release

# A pushed `v*` tag, or a run by hand with "publish" ticked, builds, packs and publishes the
# Cargo version as a GitHub release (tagging it when the tag doesn't exist yet). A pull
# request into main, or a run by hand without "publish", builds and packs only and keeps the
# installer as a workflow artifact, so a broken Windows build shows up before a release.
# The build and packing steps are in scripts/release.sh.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this commit's version as a release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish == true }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Swatinem/rust-cache@v2

      - name: Build, pack and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release.sh

      - name: Keep the installer (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Cledit-installer
          path: Releases
